<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- dev-only:start -->
  <script>
    // ES modules cannot load from file:// URLs, so double-clicking this file
    // opens the single-file standalone build instead (made by `npm run build`).
    // First thing in the document, before any stylesheet: a pending stylesheet
    // would delay this script while the preload scanner already requests
    // src/main.js. stop() halts parsing so nothing below is requested.
    if (location.protocol === 'file:') {
      window.stop();
      location.replace('./dist/boids.html');
    }
  </script>
  <!-- dev-only:end -->
  <meta name="theme-color" content="#040d1a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Boids">
  <meta name="description" content="Offline-first flocking ecosystem: three prey species, apex predators, food, life cycles and touch physics.">
  <title>Boids · Flocking Simulation</title>
  <!-- hosted-only:start -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <!-- hosted-only:end -->
  <link rel="stylesheet" href="./src/ui/ui.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #040d1a;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #sim {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #stats {
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      margin: 0;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(205, 232, 255, 0.78);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      white-space: pre;
      pointer-events: none;
    }
    noscript {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #cde8ff;
      font: 15px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="sim" aria-label="Flocking ecosystem simulation. Tap to scatter, press and hold to attract, two fingers to repel."></canvas>
  <pre id="stats" hidden></pre>
  <noscript>This simulation needs JavaScript.</noscript>
  <script type="module" src="./src/main.js"></script>
  <!-- hosted-only:start -->
  <script>
    // Offline-first: cache the app shell once it has been opened over http(s).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
  <!-- hosted-only:end -->
</body>
</html>
